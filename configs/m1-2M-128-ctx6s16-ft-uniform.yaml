# m1-2M-128-ctx6s16-ft-uniform: m1-2M-128-ctx6s16 + the 15k-step low-LR anneal (lr 1e-5, uniform sampling) that made
# m1-2M-ctx6s16-ft-uniform the best 64x64 model. Pre-registered in notes/handoff.md before launch.

data:
  folder: [data/agent, data/2m/agent]  # the original 200k-step set plus the 2M-step recording (record.py --seed 43)
  cache: data/cache/frames128_2m.npy   # palette indices, 1 byte/pixel (36 GB; RGB would be 108 GB); palette in the meta file
  cache_mmap: true                     # 36 GB vs the pod's 46 GB: map it (warm the page cache first)
  resample: nearest                    # keeps every pixel a native palette colour, so the byte cache is exactly lossless
  palette: true
  val_episodes: configs/val_episodes_2m.json   # frozen by tools/freeze_val_split.py: the 35 original val episodes + 10% of the new ones
  val_base: configs/val_episodes.json  # frozen split of the original set, reused as-is
  val_new_folder: data/2m/agent        # val_frac of these episodes join the val split
  val_frac: 0.1
  split_seed: 0
  size: 128
  context: 10
  context_offsets: [-97, -81, -65, -49, -33, -17, -4, -3, -2, -1]   # frames before the episode start clamp to its first frame

model:
  widths: [64, 64, 96, 192, 192]       # at 128 / 64 / 32 / 16 / 8 px (~19.8M params): the extra level is cheap
  blocks_per_level: 2                  # encoder blocks per level (decoder uses one more)
  attn_levels: [3, 4]                  # self-attention at 16 and 8 px, as at 64x64
  heads: 4
  cond_dim: 256
  action_embed_dim: 32
  n_actions: 9
  groupnorm_groups: 32
  fourier_dim: 64                      # Fourier features for the noise-level embeddings
  dropout: 0.0

diffusion:                             # Karras et al. 2022 (EDM), DIAMOND Atari values
  sigma_data: 0.5
  p_mean: -0.4                         # ln(sigma) ~ N(p_mean, p_std) during training
  p_std: 1.2
  sigma_min: 0.002
  sigma_max: 20.0
  rho: 7
  rollout_steps: 3                     # Euler steps for autoregressive rollouts
  grid_steps: 10                       # Euler steps for eval grids

ctx_noise:                             # GameNGen-style context noise augmentation
  enabled: true
  prob: 0.5                            # fraction of training samples whose context is noised
  sigma_min: 0.002                     # log-uniform range of the context noise level
  sigma_max: 0.5
  infer_sigma: 0.0                     # context noise level used at inference

train:
  steps: 15000
  batch_size: 64
  lr: 1.0e-5                          # 10x below the base run: the missing LR decay
  weight_decay: 0.01
  warmup_steps: 100                    # linear warmup, then constant
  grad_clip: 1.0
  ema_decay: 0.999
  bf16: true
  noise_on_device: true               # draw the 31M-number context-noise tensor on the GPU, not the CPU
  prefetch: true                       # draw the next batch in a background thread while the GPU trains
  log_every: 50
  eval_every: 2500
  eval_batches: 20                     # fixed val batches (fixed sigma and noise) for val denoising loss
  device: auto
  checkpoint_dir: checkpoints/m1-2M-128-ctx6s16-ft-uniform   # own folder; the parent is only read
  wandb_project: pacworld

eval:
  out_dir: outputs/m1-2M-128-ctx6s16-ft-uniform
  grid_samples: 8
  rollout_seconds: 5
  rollout_start: 100
  fps: 15
  upscale: 4

finetune:
  init_from: checkpoints/m1-2M-128-ctx6s16/model1_latest.pt   # read only: live + EMA weights; optimizer and step start fresh
