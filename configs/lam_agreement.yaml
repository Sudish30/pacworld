# Label-side evaluation of the latent-action project (eval/visible_ceiling.py, later eval/lam_agreement.py).
# EVALUATION ONLY: these scripts read true actions and RAM. Nothing under training or key mapping reads this config.
data:
  folder: [data/agent, data/2m/agent]  # the 2.2M-frame set; missing folders are skipped (the Mac has only data/agent)
  val_episodes: configs/val_episodes_2m.json   # the frozen split: 388 val episodes
  size: 64
  resample: box                        # the 64px cache's resize, so the detector sees what the LAM sees

decision_events:                       # metrics.responsiveness_events: RAM direction changes at i to a direction contained in actions[i-1]
  direction_ram: 56                    # ram[56] & 3: 0 up, 1 right, 2 down, 3 left
  pac_x_ram: 10
  pac_y_ram: 16
  lives_ram: 123
  start_of_life_steps: 90              # excluded after the episode start and after every life loss (as in the ghost gating)
  death_anim_steps: 12                 # excluded before every life loss
  max_step: 8                          # RAM units per step; a larger jump is a respawn or a tunnel wrap -> excluded
  min_move_px: 0.3                     # detector moves below this (64px units) count as "no move"
  folds: 2                             # best mapping fitted on one half of the val episodes, scored on the other
  ghost_x_ram: [6, 7, 8, 9]            # orange, cyan, pink, red (for the ghost-turn code-switch lift, reported only)
  ghost_y_ram: [12, 13, 14, 15]
  lag: 1                               # FIXED by the pre-registration: codes[i] is compared with actions[i-1]

gates:                                 # PRE-REGISTERED in notes/handoff.md (commit 6bb6039); never edit without the owner
  g1_min: 0.70                         # G1: decision-event accuracy of the best code -> direction map
  g1_over_majority: 0.30               #     and at least the majority-class rate + this
  g2_events: 0.65                      # G2: direction of the resolver's code = direction of the LAM's code, at decision events
  g2_all: 0.85                         #     and over all eligible steps

detector:                              # same thresholds as configs/eval.yaml (64px)
  residual_threshold: 20
  fit_threshold: 18
  min_alpha: 0.25
  min_blob_weight: 0.8
  pellet_present_frac: 0.5
  wall_pinkness: 0.5
