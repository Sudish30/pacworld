# Playable demo server. Serving m1-2M-ctx6s16-ft-uniform (ctx6s16 + 15k low-LR steps: best model so far); Model 1 is checkpoints/model1_ema.pt.
checkpoint: checkpoints/m1-2M-ctx6s16-ft-uniform/model1_ema.pt
host: 127.0.0.1          # bind to localhost only; reach it through an SSH tunnel
port: 8000
fps: 15                  # server tick rate (data rate: 60 Hz emulator / frame_skip 4)
sampler_steps: 3         # Euler steps per frame
ctx_sigma: 0.01          # context noise level at inference (GameNGen); delays the ghost collapse ~50 steps; adjustable per session from the page
start_step: 100          # where in the val episode the context is taken (past the pen period)
upscale: 6               # canvas scale (nearest-neighbour), used by the page
bf16: true
stats_log_every_s: 5

# Watchdog: the model can lose Pac-Man for good (empty maze after a death, endless frightened phase). The real game
# never hides him for a single frame (checked on 4,864 recorded frames), so a long absence means the world is stuck.
watchdog:
  enabled: true
  detector_config: configs/eval.yaml   # detector thresholds and the reference maze
  check_every: 3           # run the Pac-Man detector on every 3rd frame (6.6 ms per check)
  missing_checks: 15       # consecutive checks without Pac-Man before a new session starts (15 x 3 = 45 steps = 3 s)
